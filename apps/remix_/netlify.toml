[build]
command = "turbo run build --filter remix_"
publish = "apps/remix_/build/client"

[dev]
command = "pnpm dev --filter remix_"
framework = "vite"

# Set immutable caching for static files, because they have fingerprinted filenames

[[headers]]
for = "/build/*"

[headers.values]

"Cache-Control" = "public, max-age=31560000, immutable"
